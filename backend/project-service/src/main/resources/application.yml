# =====================================================================
# project-service 配置模板（8084）
# =====================================================================
server:
  port: 8084

spring:
  application:
    name: project-service

  # ===== MySQL：项目收藏（project 表）=====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:java_agent_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  config:
    import:
      # 本机开发的值统一写在项目根目录的 .env.local（已在 .gitignore 中，不会提交）
      # 两个候选路径分别覆盖「工作目录 = 项目根」与「工作目录 = 模块目录」两种情况
      - optional:file:./.env.local[.properties]
      - optional:file:../../.env.local[.properties]
      # 从 Nacos 拉取自身配置（团队/生产推荐用这里集中管理），Nacos 不可用时不阻塞启动
      - optional:nacos:${spring.application.name}.yaml

  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml

# ===== MyBatis-Plus =====
mybatis-plus:
  # 复杂 SQL 的 XML 文件放在 resources/mapper 下（单表 CRUD 用 BaseMapper，无需 XML）
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.itcast.agent.project.entity
  configuration:
    # 下划线字段自动映射为驼峰属性：create_time -> createTime
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，便于观察实际执行的语句；上线前请改为 Slf4jImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# ===== 可观测性：actuator + Prometheus =====
# 指标端点只在宿主机 / 容器网络内可访问：网关只有 /api/** 路由，外部无法从 8080 访问 /actuator/**
management:
  endpoints:
    web:
      exposure:
        # 只暴露必要端点；env / beans / configprops 等会泄露配置，保持关闭
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 开发期展示组件明细（数据库等）；上线前改为 when-authorized
      show-details: always
  metrics:
    tags:
      # 所有指标带上服务名，Prometheus 里可按 application 维度筛选
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    cn.itcast.agent: debug