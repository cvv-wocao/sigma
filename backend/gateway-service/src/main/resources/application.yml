# =====================================================================
# gateway-service 配置模板（8080）
# 可变项一律通过环境变量注入，模板见项目根目录 .env.example
#
# 注意：Spring Cloud Gateway 5.0.0（Spring Cloud 2025.1.0）起，
#       路由相关配置从 spring.cloud.gateway.* 迁移到 spring.cloud.gateway.server.webflux.*，
#       旧前缀不会被识别，会导致所有路由失效、请求一律 404。
# =====================================================================
server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import:
      # 本机开发的值统一写在项目根目录的 .env.local（已在 .gitignore 中，不会提交）
      # 两个候选路径分别覆盖「工作目录 = 项目根」与「工作目录 = 模块目录」两种情况
      - optional:file:./.env.local[.properties]
      - optional:file:../../.env.local[.properties]
      # 从 Nacos 拉取自身配置（团队/生产推荐用这里集中管理），Nacos 不可用时不阻塞启动
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
    gateway:
      # 路由规则：统一以 /api/** 前缀对外，去掉 /api 后转发到注册中心内的服务实例
      server:
        webflux:
          discovery:
            # 关闭「按服务名自动生成路由」：开启后会额外暴露 /user-service/** 这类
            # 绕过 /api 前缀的入口，与下面显式声明的路由重复。显式路由足够，故关闭。
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=1
            - id: ai-service
              uri: lb://ai-service
              predicates:
                - Path=/api/ai/**
              filters:
                - StripPrefix=1
            - id: search-service
              uri: lb://search-service
              predicates:
                - Path=/api/search/**
              filters:
                - StripPrefix=1
            - id: project-service
              uri: lb://project-service
              predicates:
                - Path=/api/project/**
              filters:
                - StripPrefix=1
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600

# ===== 可观测性：actuator + Prometheus =====
# 指标端点只在宿主机 / 容器网络内可访问：网关只有 /api/** 路由，外部无法从 8080 访问 /actuator/**
management:
  endpoints:
    web:
      exposure:
        # 只暴露必要端点；env / beans / configprops 等会泄露配置，保持关闭
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 开发期展示组件明细（数据库、Redis 等）；上线前改为 when-authorized
      show-details: always
  metrics:
    tags:
      # 所有指标带上服务名，Prometheus 里可按 application 维度筛选
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    cn.itcast.agent: debug
    # 需要排查路由匹配时把下一行打开（会打印每条路由的匹配过程）
    # org.springframework.cloud.gateway: debug

# ===== 鉴权 =====
agent:
  auth:
    jwt:
      # 必须与 user-service 的 agent.auth.jwt.secret 完全一致，否则令牌无法互认
      secret: ${JWT_SECRET:java-agent-platform-dev-secret-key-change-me-please}
      expire-minutes: ${JWT_EXPIRE_MINUTES:120}
      issuer: java-agent-platform
    # 免鉴权路径（Ant 风格），其余 /api/** 一律要求 Authorization: Bearer <token>
    whitelist:
      - /api/user/register
      - /api/user/login
      # 微信支付回调由微信服务器直接调用，使用 API v3 签名验真，不携带用户 JWT
      - /api/ai/wallet/wechat/notify
