# =====================================================================
# java-agent-platform 网关入口配置
# 静态资源：/usr/share/nginx/html（frontend/dist 只读挂载）
# 接口反向代理：/api/** -> gateway-service
# =====================================================================
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 20m;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    # 网关地址：容器化后走 compose 网络内的服务名 gateway-service:8080。
    # 这里用 Docker 内置 DNS(127.0.0.11) + 变量做「请求时解析」，
    # 因此只启动基础设施（网关未运行时）nginx 也能正常启动，而不是启动失败。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen       80;
        server_name  localhost;

        # 带哈希的构建产物：找不到就 404，绝不能回退到 index.html。
        # 如果这里回退成 index.html，浏览器会以 text/html 的 MIME 去加载 .js 模块而被拒绝执行，
        # 表现为「刷新后整个页面打不开」——典型触发场景是重新构建 dist 之后，浏览器还拿着旧 index.html。
        location /assets/ {
            root       /usr/share/nginx/html;
            try_files  $uri =404;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # 入口页不做强缓存：构建产物名带哈希，只有拿到最新 index.html 才能加载到正确的 chunk
        location = /index.html {
            root       /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 前端单页应用
        location / {
            root       /usr/share/nginx/html;
            index      index.html;
            try_files  $uri $uri/ /index.html;
        }

        # 后端接口
        location /api/ {
            set                $gateway_backend gateway-service:8080;
            proxy_pass         http://$gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # 健康检查
        location /health {
            default_type text/plain;
            return 200 'ok';
        }
    }
}