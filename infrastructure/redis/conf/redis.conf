# =====================================================================
# Redis 配置模板（本地开发 / 骨架阶段）
# 密码由 docker-compose 通过 --requirepass 注入，本文件不写密码
# =====================================================================

bind 0.0.0.0
port 6379
protected-mode no
timeout 0
tcp-keepalive 300

# 持久化：AOF + 每秒刷盘
appendonly yes
appendfsync everysec
dir /data

# 内存与淘汰策略
maxmemory 512mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice